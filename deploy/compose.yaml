# Distribution environment (students and the first QGC import). Project name tfg-dist.
#
# It never creates, starts or stops the development/operational containers tfg-ardupilot-gazebo
# and tfg-ardupilot-ros2 (created by hand, not by Compose); `down` here only touches tfg-dist.
# Paths in this file are relative to deploy/. Results live in bind-mounted project directories,
# so `down` never deletes them (no named volumes are used).
#
#   docker compose -f deploy/compose.yaml --profile qgc build qgc
#   QGC_SAVE_DIR=$PWD/<new dir> docker compose -f deploy/compose.yaml --profile qgc run --rm qgc
#   docker compose -f deploy/compose.yaml --profile app build app
#   docker compose -f deploy/compose.yaml run --rm app                  (main menu; option 5 = scenario)
#
# Profiles:
#   qgc  QGroundControl 5.1.5 for the offline .plan import: no network, no devices, read-only plan.
#   app  DISTRIBUTION: code, dependencies, inputs and evidence inside the image; no network; read-only root;
#        the only writable place is /work (TFG_WORK_DIR on the host, default ../work, must exist); the planning
#        store (TFG_PLANNING_STORE) is mounted read-only at /planning_store.
#   dev  DEVELOPMENT: same image, but the repository sources are mounted read-only over /opt/tfg.
#   planning       AI planning (deploy/planner): `hermes` (Hermes + project MCP server restricted to the planning
#                  tools; provider login in the hermes-home volume), `planner-menu` (main menu; options 1/3 use
#                  the `ollama` service), `ollama` (official 0.34.2, models in the ollama-models volume).
#                  Drafts, missions and reports: TFG_PLANNING_STORE (default ../work/planning_store, must exist).
#   planning-test  TEST DOUBLES only (fake provider on an internal network): deploy/planner/planning_checks.sh.
#   sim  not defined: the simulator still lives in a hand-made mutable container (see
#        docs/simulator-distribution-handoff.md).
name: tfg-dist

x-app: &app
  image: tfg/app:2026.10.30
  # No network namespace: no LLM provider, Opik, simulator or vehicle is reachable.
  network_mode: none
  user: "${TFG_UID:-1000}:${TFG_GID:-1000}"
  read_only: true
  init: true  # Ctrl+C / docker stop reach Python, which keeps durable records and reports the interruption
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:mode=1777

x-planner: &planner
  image: tfg/planner:2026.10.28
  user: "${TFG_UID:-1000}:${TFG_GID:-1000}"
  read_only: true
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:mode=1777
  volumes:
    # Drafts, finalizations, missions and reports of the project stores (only this directory is writable).
    - type: bind
      source: ${TFG_PLANNING_STORE:-../work/planning_store}
      target: /opt/tfg/missions/generated
      bind: {create_host_path: false}
    - type: bind
      source: ${TFG_WORK_DIR:-../work}
      target: /work
      bind: {create_host_path: false}
    # Hermes homes: planning sessions and the operator's own provider login (never in the image).
    - hermes-home:/hermes

x-planner-test: &planner-test
  <<: *planner
  networks: [test]
  volumes:
    - type: bind
      source: ${TFG_PLANNING_STORE:-../work/planning_store}
      target: /opt/tfg/missions/generated
      bind: {create_host_path: false}
    - type: bind
      source: ${TFG_WORK_DIR:-../work}
      target: /work
      bind: {create_host_path: false}

services:
  qgc:
    profiles: ["qgc"]
    image: tfg/qgroundcontrol:5.1.5
    build: ./qgc
    # No network namespace at all: no vehicle, SITL, UDP 14550 or ZeroConf endpoint is reachable,
    # whatever QGC settings say. The display is reached through the X11 unix socket only.
    network_mode: none
    user: "${TFG_UID:-1000}:${TFG_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:mode=1777
      - /home/qgc:uid=${TFG_UID:-1000},gid=${TFG_GID:-1000},mode=0700
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      # WSLg (or native Linux) X server socket, read-only; no xhost, no TCP display, no GPU device.
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind: {create_host_path: false}
      # Plans to open, read-only: QGC cannot overwrite the sealed package.
      - type: bind
        source: ${QGC_PLAN_DIR:-../evaluation/observability/agri_export_semantics_2026_10_27/packages/b_synthetic_orchard_v1_sitl_v2/plans}
        target: /data/plan
        read_only: true
        bind: {create_host_path: false}
      # The only writable place: where QGC saves its copy. Must exist before starting.
      - type: bind
        source: ${QGC_SAVE_DIR:-./QGC_SAVE_DIR_not_set}
        target: /data/saved
        bind: {create_host_path: false}

  app:
    <<: *app
    profiles: ["app"]
    build:
      context: ..
      dockerfile: deploy/app/Dockerfile
    volumes:
      - type: bind
        source: ${TFG_WORK_DIR:-../work}
        target: /work
        bind: {create_host_path: false}
      # The planning store written by the hermes service, READ-ONLY: `scenario_package package-finalized --store
      # /planning_store` packages its finalizations; results go to /work. Unset: an empty placeholder directory.
      - type: bind
        source: ${TFG_PLANNING_STORE:-./app/no_planning_store}
        target: /planning_store
        read_only: true
        bind: {create_host_path: false}

  app-dev:
    <<: *app
    profiles: ["dev"]
    volumes:
      - type: bind
        source: ..
        target: /opt/tfg
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TFG_WORK_DIR:-../work}
        target: /work
        bind: {create_host_path: false}

  # ---- planning profile -----------------------------------------------------------------------------------
  hermes:
    <<: *planner
    profiles: ["planning"]
    build:
      context: ..
      dockerfile: deploy/planner/Dockerfile
      # frozen Hermes source: python3 deploy/planner/hermes_source.py fetch --out deploy/planner/vendor/hermes-agent-d923a5eb.tar
      additional_contexts:
        hermes_src: ./planner/vendor
    # Egress only for the model provider; not attached to any simulator or vehicle network.
    networks: [provider]
    command: ["/opt/tfg/deploy/planner/hermes_home.py", "run"]

  planner-menu:
    <<: *planner
    profiles: ["planning"]
    networks: [local-llm]
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["main.py"]

  ollama:
    profiles: ["planning"]
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    # local-llm serves the menu; provider is only needed to pull a model into the volume.
    networks: [local-llm, provider]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ollama-models:/root/.ollama

  # ---- planning-test profile: TEST DOUBLES, internal network without egress -------------------------------
  fake-provider:
    <<: *planner-test
    profiles: ["planning-test"]
    environment:
      FAKE_SCENARIO: ${FAKE_SCENARIO:-planning}
      FAKE_DELAY_S: ${FAKE_DELAY_S:-60}
      FAKE_RECORDS: /work/fake_provider_requests.jsonl
    volumes:
      - type: bind
        source: ./planner/doubles
        target: /doubles
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${TFG_WORK_DIR:-../work}
        target: /work
        bind: {create_host_path: false}
    command: ["/doubles/fake_provider.py"]

  hermes-test:
    <<: *planner-test
    profiles: ["planning-test"]
    environment:
      HERMES_HOME: /work/hermes_test_home
      OLLAMA_HOST: http://fake-provider:8000
    command: ["/opt/tfg/deploy/planner/hermes_home.py", "status"]

volumes:
  hermes-home:
  ollama-models:

networks:
  provider: {}
  local-llm:
    internal: true
  test:
    internal: true
