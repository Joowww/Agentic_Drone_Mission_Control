name: tfg-estudiante
services:
  qgc:
    profiles:
      - qgc
    cap_drop:
      - ALL
    environment:
      DISPLAY: :0
    image: tfg/qgroundcontrol:5.1.5
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
      - /home/qgc:uid=1000,gid=1000,mode=0700
    user: 1000:1000
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /tmp/claude-1000/-home-joelm-TFG-Agentic-Drone-Mission-Control/9f34a360-10f9-4576-9e3b-0719b9c991b9/scratchpad/isolated_2026_10_28/results/paquete_1/plans
        target: /data/plan
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /tmp/claude-1000/-home-joelm-TFG-Agentic-Drone-Mission-Control/9f34a360-10f9-4576-9e3b-0719b9c991b9/scratchpad/isolated_2026_10_28/results/qgc_guardado
        target: /data/saved
        bind:
          create_host_path: false
x-app:
  cap_drop:
    - ALL
  image: tfg/app:2026.10.27-r2
  init: true
  network_mode: none
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777
  user: 1000:1000
x-planner:
  cap_drop:
    - ALL
  image: tfg/planner:2026.10.28
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777
  user: 1000:1000
  volumes:
    - bind:
        create_host_path: false
      source: /tmp/claude-1000/-home-joelm-TFG-Agentic-Drone-Mission-Control/9f34a360-10f9-4576-9e3b-0719b9c991b9/scratchpad/isolated_2026_10_28/planning_store
      target: /opt/tfg/missions/generated
      type: bind
    - bind:
        create_host_path: false
      source: /tmp/claude-1000/-home-joelm-TFG-Agentic-Drone-Mission-Control/9f34a360-10f9-4576-9e3b-0719b9c991b9/scratchpad/isolated_2026_10_28/results
      target: /work
      type: bind
    - hermes-home:/hermes
