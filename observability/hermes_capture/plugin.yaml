name: tfg-observability-capture
version: "0.2.0"
description: "TFG prototype: metadata-only capture of LLM call usage/latency and tool names to local JSONL. Disabled unless TFG_OBSERVABILITY_CAPTURE=1 and an absolute TFG_OBSERVABILITY_DIR are set. No prompts, responses, tool arguments/results or network export."
author: "TFG Agentic Drone Mission Control"
provides_hooks:
  - post_api_request
  - api_request_error
  - post_tool_call
