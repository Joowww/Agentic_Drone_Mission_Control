name: tfg-observability-capture
version: "0.6.0"
description: "TFG prototype: metadata-only capture of LLM call usage/latency, offered tool names and tool names to local JSONL, plus an opt-in pass/fail comparison of allow-listed tool-result fields. Disabled unless TFG_OBSERVABILITY_CAPTURE=1 and an absolute TFG_OBSERVABILITY_DIR are set. No prompts, responses, tool descriptions/arguments/result values or network export."
author: "TFG Agentic Drone Mission Control"
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - post_tool_call
